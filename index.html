<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Σύγκρασης 🇨🇾</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17324d;background:linear-gradient(135deg,#ffd166,#ef476f 45%,#118ab2);transition:background .4s}
.app{max-width:760px;margin:auto}.card{background:rgba(255,255,255,.95);border-radius:28px;padding:24px;box-shadow:0 18px 50px #0003}
.hero{text-align:center;padding:38px 22px}.flag{font-size:52px}.hero h1{font-size:clamp(34px,9vw,58px);margin:8px 0}.hero p{font-size:18px}.start,.next,.again{border:0;border-radius:18px;padding:15px 24px;font-size:17px;font-weight:800;cursor:pointer;background:#17324d;color:#fff}
.hidden{display:none}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px}.pill,.badge{padding:8px 12px;border-radius:999px;font-weight:800;background:#edf6ff}.bar{height:12px;background:#e7edf2;border-radius:20px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:linear-gradient(90deg,#06d6a0,#118ab2,#8338ec);transition:.35s}.q{font-size:clamp(23px,5vw,32px);font-weight:800;line-height:1.2;margin:12px 0 20px}.answers{display:grid;gap:12px}.answer{border:2px solid #dbe5ee;background:#fff;border-radius:17px;padding:15px;text-align:left;font-size:16px;font-weight:700;cursor:pointer}.answer.correct{background:#d8f8ec;border-color:#06a777}.answer.wrong{background:#ffe0e5;border-color:#ef476f}.answer:disabled{cursor:default}.feedback{min-height:28px;margin:15px 0;font-weight:800}.next{display:none;width:100%;margin-top:8px;background:#8338ec}.result{text-align:center}.score{font-size:58px;font-weight:900}.stars{font-size:38px}.visual{height:190px;border-radius:22px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;font-size:78px;background:linear-gradient(135deg,#90e0ef,#ffd166)}.small{opacity:.7;font-size:14px}
.q1{background:linear-gradient(135deg,#ffcf56,#ff7b54,#ef476f)}.q2{background:linear-gradient(135deg,#83c5be,#219ebc,#023047)}.q3{background:linear-gradient(135deg,#ffd166,#f77f00,#d62828)}.q4{background:linear-gradient(135deg,#cdb4db,#8e7dbe,#5e548e)}.q5{background:linear-gradient(135deg,#90dbf4,#48cae4,#0077b6)}.q6{background:linear-gradient(135deg,#b7efc5,#70e000,#38a3a5)}.q7{background:linear-gradient(135deg,#ffc8dd,#ffafcc,#cdb4db)}.q8{background:linear-gradient(135deg,#ffe66d,#ff9f1c,#e76f51)}.q9{background:linear-gradient(135deg,#a8dadc,#457b9d,#1d3557)}.q10{background:linear-gradient(135deg,#ffd6a5,#ffadad,#bdb2ff)}
</style>
</head>
<body>
<div class="app">
<section id="home" class="card hero"><div class="flag">🇨🇾</div><h1>Quiz Σύγκρασης</h1><p>Πόσα γνωρίζεις για τη Σύγκραση;</p><button class="start" onclick="startQuiz()">Ξεκίνα το παιχνίδι 🎮</button><p class="small">10 ερωτήσεις • χωρίς χρονόμετρο</p></section>
<section id="quiz" class="card hidden"><div class="top"><span id="count" class="pill"></span><span id="score" class="pill">⭐ 0</span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="badge" class="badge"></div><div id="visual" class="visual hidden"></div><div id="question" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="next" class="next" onclick="nextQuestion()">Επόμενη ➜</button></section>
<section id="result" class="card result hidden"><div class="stars">🏆</div><h1>Τέλος!</h1><div id="finalScore" class="score"></div><p id="message"></p><button class="again" onclick="startQuiz()">Παίξε ξανά 🔄</button></section>
</div>
<script>
const questions=[
["Σε ποια επαρχία της Κύπρου βρίσκεται η Σύγκραση;",["Λευκωσίας","Αμμοχώστου","Λεμεσού","Πάφου"],1,"ΕΥΚΟΛΟ"],
["Η κύρια εκκλησία της Σύγκρασης είναι αφιερωμένη στον Άγιο Προκόπιο.",["Σωστό","Λάθος"],0,"ΕΥΚΟΛΟ"],
["Πότε γίνεται η πανήγυρη του Αγίου Προκοπίου;",["8 Ιουλίου","1 Μαΐου","15 Αυγούστου","25 Δεκεμβρίου"],0,"ΜΕΤΡΙΟ"],
["Με τι συνδέεται ιδιαίτερα η Σύγκραση;",["Με τον ταμιευτήρα/φράγμα της","Με χιονοδρομικό κέντρο","Με αεροδρόμιο","Με μεγάλο λιμάνι"],0,"ΜΕΤΡΙΟ"],
["Ο ταμιευτήρας της Σύγκρασης χτίστηκε το 1900.",["Σωστό","Λάθος"],0,"ΜΕΤΡΙΟ"],
["Ποιο ξωκλήσι βρίσκεται στην περιοχή της Σύγκρασης;",["Αγία Παρασκευή","Άγιος Λάζαρος","Άγιος Νικόλαος","Παναγία Φανερωμένη"],0,"ΜΕΤΡΙΟ"],
["Η Σύγκραση είναι κτισμένη σε πλαγιά υψώματος/οροπεδίου.",["Σωστό","Λάθος"],0,"ΜΕΤΡΙΟ"],
["Μία ερμηνεία για το όνομα «Σύγκραση» συνδέεται με…",["την ανάμειξη διαφορετικών εδαφών","το χιόνι","τη θάλασσα","την καλλιέργεια αμπελιών"],0,"ΔΥΣΚΟΛΟ"],
["📷 Ποιο θρησκευτικό μνημείο σχετίζεται με τη Σύγκραση;",["Άγιος Προκόπιος","Άγιος Γεώργιος","Παναγία","Άγιος Νικόλαος"],0,"ΦΩΤΟ"],
["📷 Τι βλέπουμε στη φωτογραφία;",["Ταμιευτήρα/φράγμα Σύγκρασης","Λιμάνι Λάρνακας","Αλυκή Λάρνακας","Μαρίνα Αγίας Νάπας"],0,"ΦΩΤΟ"]
];
let i=0,points=0;
function startQuiz(){i=0;points=0;document.getElementById("home").classList.add("hidden");document.getElementById("result").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");show()}
function show(){const x=questions[i];document.body.className="q"+(i+1);count.textContent=(i+1)+" / 10";score.textContent="⭐ "+points;fill.style.width=(i*10)+"%";badge.textContent=x[3];question.textContent=x[0];feedback.textContent="";next.style.display="none";visual.classList.toggle("hidden",i<8);if(i>=8)visual.textContent=i===8?"⛪":"🌊";answers.innerHTML="";x[1].forEach((t,n)=>{const b=document.createElement("button");b.className="answer";b.textContent=String.fromCharCode(65+n)+". "+t;b.onclick=()=>answer(n,b);answers.appendChild(b)})}
function answer(n,b){const x=questions[i];document.querySelectorAll(".answer").forEach(z=>z.disabled=true);if(n===x[2]){points++;b.classList.add("correct");feedback.textContent="✅ Μπράβο! Σωστή απάντηση!"}else{b.classList.add("wrong");document.querySelectorAll(".answer")[x[2]].classList.add("correct");feedback.textContent="❌ Η σωστή απάντηση είναι η επισημασμένη."}score.textContent="⭐ "+points;next.style.display="block"}
function nextQuestion(){i++;i<10?show():finish()}
function finish(){quiz.classList.add("hidden");result.classList.remove("hidden");finalScore.textContent=points+" / 10";message.textContent=points>=9?"🌟 Εξαιρετικά!":points>=6?"👏 Πολύ καλά!":"😊 Μπράβο που έπαιξες! Δοκίμασε ξανά!"}
</script>
</body></html>
